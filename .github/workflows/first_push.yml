name: First_Push
on: 
  push:
jobs:
  Tarea1:
    runs-on: ubuntu-latest

    steps:
     - name: Say Ayy
       run: |
         echo "Hi fella, my first push" 
         echo "My name is Leonel Torres" 
         
     - name: push_actions
       run: |
        echo "Datos del Push:"
        echo "ID (Commit): ${{ github.sha }}"
        echo "Mensaje ${{github.event.head_commit.message}}"
        echo "Autor: ${{ github.event.head_commit.author.name}}"
        echo "URL: ${{github.event.head_commit.url}}"
        echo Rama:"${{ github.ref_name }}"
        echo Repositorio "${{github.repository}}"

     - name: pull_request
       run: |
        echo "Datos Pull Request:" 
        echo "Datos destino: ${{github.event.pull_request.base.ref}}"
    
        echo "Datos origen (Head branch): ${{ github.event.pull_request.head.ref }}"
        echo "Título: ${{ github.event.pull_request.title }}"
        echo "Contenido del PR: ${{ github.event.pull_request.body }}"
        echo "Estado: ${{ github.event.pull_request.state }}"
        echo "Ya fue fusionado?: ${{ github.event.pull_request.merged }}"
         
